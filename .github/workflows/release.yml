name: Release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require a version-matched commit contained in main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_versions.py "$TAG"
          git merge-base --is-ancestor HEAD origin/main

  checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  draft:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skeleton-windows-latest
          path: release
      - name: Create checksums and release draft
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum dist/* integrations/trae/dist/*.vsix > SHA256SUMS
          gh release create "$TAG" --verify-tag --draft --title "$TAG" \
            --notes 'Engineering skeleton build. CI success does not certify phase-one business acceptance or real Trae compatibility. Review compatibility and test evidence before publishing.' \
            dist/* integrations/trae/dist/*.vsix docs/validation/artifacts.json SHA256SUMS
