name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  basic-checks:
    name: Basic checks (Windows)
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Check package versions
        run: uv run python scripts/check_versions.py
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Check current-status docs against code
        run: uv run python scripts/check_docs_facts.py
      - name: Check audit fix ledger covers every issue
        run: uv run python scripts/audit_ledger.py --check
      - name: Collect every test module (import errors still fail the job)
        run: uv run pytest --collect-only -q

      # 这里跑完整 Python 测试套件（没有 marker/路径筛选）；耗时随节点数增长。
      # nightly 工作流另外执行同一套全量回归。面板 e2e（Playwright）与面板 lint
      # 不在 basic-checks/ui-checks 内，发布前由人工或专门的 e2e 任务执行。
      - name: Run tests
        run: >
          uv run pytest
          --junitxml="${{ runner.temp }}/aitest-pytest.xml"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-windows
          path: ${{ runner.temp }}/aitest-pytest.xml
          if-no-files-found: ignore
          retention-days: 14

      # Release artifacts are only needed when the reusable workflow is called by a version tag.
      - name: Set up Node for release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            panel/package-lock.json
            integrations/trae/package-lock.json
      - name: Install shared panel dependencies
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix panel ci
      - name: Build shared panel
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix panel run build
      - name: Install Trae extension dependencies
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix integrations/trae ci
      - name: Package Trae extension
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix integrations/trae run package
      # 首次使用要在离线状态安装自带的 aitest wheel；VSIX 缺 wheel 视为打包失败。
      - name: Verify the VSIX carries the offline wheel
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $vsix = Join-Path $env:GITHUB_WORKSPACE 'integrations\trae\dist\aitest-trae.vsix'
          $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix)
          $wheels = @($zip.Entries | Where-Object { $_.FullName -match '^extension/media/runtime/.*\.whl$' })
          $zip.Dispose()
          if ($wheels.Count -eq 0) { throw 'VSIX 缺少 extension/media/runtime/*.whl' }
          $wheels | ForEach-Object { Write-Host $_.FullName }
          # aitest wheel 版本必须与 pyproject.toml 一致，避免把旧 CLI 打进新 VSIX。
          $pyproject = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'pyproject.toml') -Raw
          $expected = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $own = @($wheels | Where-Object { $_.FullName -match '/(ai_test_component|aitest)-(\d+\.\d+(?:\.\d+)?)-' })
          if ($own.Count -ne 1) { throw "VSIX 应包含且仅包含 1 个 aitest wheel，实际 $($own.Count)" }
          $actual = [regex]::Match($own[0].FullName, '/(?:ai_test_component|aitest)-(\d+\.\d+(?:\.\d+)?)-').Groups[1].Value
          if ($actual -ne $expected) { throw "VSIX 内 aitest wheel 版本 $actual 与 pyproject.toml 的 $expected 不一致" }
      # Builds dist/*.whl, installs it into a temp venv and runs `doctor`
      # there, asserting an `ok: true` envelope. No artifact metadata checks.
      - name: Smoke-test built wheel
        run: uv run python scripts/smoke_wheel.py
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-windows-latest
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*
            integrations/trae/dist/*.vsix

  python-compat:
    name: Python ${{ matrix.python }} unit compatibility
    timeout-minutes: 20
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }} --extra dev --locked
      - name: Run unit tests on the declared minimum versions
        run: uv run --python ${{ matrix.python }} pytest tests/unit -q

  ui-checks:
    name: Panel and extension checks (Windows)
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 扩展构建会先打 aitest wheel（media/runtime），离线安装材料随 VSIX 分发。
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            panel/package-lock.json
            integrations/trae/package-lock.json
      - name: Install shared panel dependencies
        run: npm --prefix panel ci
      - name: Run shared panel tests
        run: npm --prefix panel test
      - name: Build shared panel
        run: npm --prefix panel run build
      - name: Install Trae extension dependencies
        run: npm --prefix integrations/trae ci
      - name: Run Trae extension tests
        run: npm --prefix integrations/trae test
      - name: Build Trae extension
        run: npm --prefix integrations/trae run build
      - name: Check the extension build carries the offline wheel
        shell: bash
        run: |
          ls -l integrations/trae/media/runtime/*.whl

