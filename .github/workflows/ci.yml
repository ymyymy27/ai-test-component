name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  basic-checks:
    name: Basic checks (Windows)
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Check package versions
        run: uv run python scripts/check_versions.py
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/generate_schemas.py
      - name: Check generated schemas including new files
        shell: pwsh
        run: |
          $schemaChanges = git status --porcelain --untracked-files=all -- src/aitest/contracts/schemas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($schemaChanges) {
            $schemaChanges
            throw 'Generated schemas differ from the committed files.'
          }
      - name: Collect every test module (import errors still fail the job)
        run: uv run pytest --collect-only -q

      # 完整 Python 回归在本机约 16 小时（见 docs/现状.md），远超托管运行器
      # 的单作业上限；这里跑快速且有代表性的合同/架构/恢复/验收检查与核心
      # 单元冒烟，完整回归仍由发布前本地或专用环境执行。
      - name: Run bounded basic checks
        run: >
          uv run pytest
          tests/contracts
          tests/architecture
          tests/recovery
          tests/acceptance
          tests/integration
          tests/unit/test_bounded_query_directory.py
          tests/unit/test_review_decision.py
          tests/unit/test_query_material_identity.py
          tests/unit/test_finite_query_routes.py
          tests/unit/test_query_spec_bridge.py
          tests/unit/test_reporting_application.py
          tests/unit/test_saved_reports.py
          tests/unit/test_panel_view_dto.py
          tests/unit/test_sharded_record_authority.py
          --junitxml="${{ runner.temp }}/aitest-pytest.xml"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-windows
          path: ${{ runner.temp }}/aitest-pytest.xml
          if-no-files-found: ignore
          retention-days: 14

      # Release artifacts are only needed when the reusable workflow is called by a version tag.
      - name: Set up Node for release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            src/aitest/resources/panel/package-lock.json
            integrations/trae/package-lock.json
      - name: Install shared panel dependencies
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix src/aitest/resources/panel ci
      - name: Build shared panel
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix src/aitest/resources/panel run build
      - name: Install Trae extension dependencies
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix integrations/trae ci
      - name: Package Trae extension
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix integrations/trae run package
      - run: uv build
        if: startsWith(github.ref, 'refs/tags/v')
      - run: uv run python scripts/verify_artifacts.py
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Smoke-test built wheel
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python scripts/smoke_wheel.py
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-windows-latest
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*
            integrations/trae/dist/*.vsix
            docs/validation/artifacts.json
