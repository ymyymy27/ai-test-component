name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  basic-checks:
    name: Basic checks (Windows)
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Check package versions
        run: uv run python scripts/check_versions.py
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Check current-status docs against code
        run: uv run python scripts/check_docs_facts.py
      - name: Collect every test module (import errors still fail the job)
        run: uv run pytest --collect-only -q

      # 完整 Python 回归随节点数和机器负载变化（2026-11-04 的 -n 8 记录为 50:37，
      # 2026-11-10 全量为 6,104 节点）；托管运行器上由 nightly 工作流执行全量，
      # 这里跑快速且有代表性的合同/架构/恢复/验收检查与核心单元冒烟。
      - name: Run tests
        run: >
          uv run pytest
          --junitxml="${{ runner.temp }}/aitest-pytest.xml"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-windows
          path: ${{ runner.temp }}/aitest-pytest.xml
          if-no-files-found: ignore
          retention-days: 14

      # Release artifacts are only needed when the reusable workflow is called by a version tag.
      - name: Set up Node for release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            panel/package-lock.json
            integrations/trae/package-lock.json
      - name: Install shared panel dependencies
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix panel ci
      - name: Build shared panel
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix panel run build
      - name: Install Trae extension dependencies
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix integrations/trae ci
      - name: Package Trae extension
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix integrations/trae run package
      # 首次使用要在离线状态安装自带的 aitest wheel；VSIX 缺 wheel 视为打包失败。
      - name: Verify the VSIX carries the offline wheel
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $vsix = Join-Path $env:GITHUB_WORKSPACE 'integrations\trae\dist\aitest-trae.vsix'
          $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix)
          $wheels = @($zip.Entries | Where-Object { $_.FullName -match '^extension/media/runtime/.*\.whl$' })
          $zip.Dispose()
          if ($wheels.Count -eq 0) { throw 'VSIX 缺少 extension/media/runtime/*.whl' }
          $wheels | ForEach-Object { Write-Host $_.FullName }
      # Builds dist/*.whl, installs it into a temp venv and runs `doctor`
      # there, asserting an `ok: true` envelope. No artifact metadata checks.
      - name: Smoke-test built wheel
        run: uv run python scripts/smoke_wheel.py
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-windows-latest
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*
            integrations/trae/dist/*.vsix

  ui-checks:
    name: Panel and extension checks (Windows)
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 扩展构建会先打 aitest wheel（media/runtime），离线安装材料随 VSIX 分发。
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            panel/package-lock.json
            integrations/trae/package-lock.json
      - name: Install shared panel dependencies
        run: npm --prefix panel ci
      - name: Run shared panel tests
        run: npm --prefix panel test
      - name: Build shared panel
        run: npm --prefix panel run build
      - name: Install Trae extension dependencies
        run: npm --prefix integrations/trae ci
      - name: Run Trae extension tests
        run: npm --prefix integrations/trae test
      - name: Build Trae extension
        run: npm --prefix integrations/trae run build
      - name: Check the extension build carries the offline wheel
        shell: bash
        run: |
          ls -l integrations/trae/media/runtime/*.whl

