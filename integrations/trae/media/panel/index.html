<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="AI 测试 · 本地测试工作台" />
    <title>AI 辅助测试</title>
    <script>
      // 首帧前确定主题，避免暗色系统先闪白色；ui store 初始化后会再次校正。
      (function () {
        try {
          var stored = localStorage.getItem("aitest.theme");
          var choice = stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
          var dark =
            choice === "dark" ||
            (choice === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themeChoice = choice;
        } catch (error) {
          // 存储不可用时保留 HTML 上的默认浅色。
        }
      })();
    </script>
    <script type="module" crossorigin src="./panel.js"></script>
    <link rel="stylesheet" crossorigin href="./panel.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
