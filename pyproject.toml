[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-test-component"
version = "0.5.0"
description = "Phase-one local AI-assisted testing component preview"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "AI Test Component Team" }]
dependencies = [
  "portalocker>=3.2,<4",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-timeout>=2.3,<3",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.11,<1",
]

[project.scripts]
aitest = "aitest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aitest"]

[tool.hatch.build]
include = [
  "src/aitest/**/*.py",
  "src/aitest/resources/templates/**/*.json",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]
norecursedirs = ["tests/acceptance/p1/evidence"]
# 单个用例挂起时由插件统一终止，而不是等 CI job 超时。
timeout = 300
timeout_method = "thread"

[tool.ruff]
target-version = "py311"
line-length = 100
# Validation archives retain the exact historical counterexample source bytes.
extend-exclude = [".uv-cache", ".uv-python", ".venv", "node_modules", ".zcode", "tests/acceptance/p1/evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aitest"]
mypy_path = "src"
