[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-test-component"
version = "0.4.0"
description = "Phase-one local AI-assisted testing plugin skeleton"
readme = "README.md"
# 工程基线 py3.13；运行验证已扩展至 py3.14.7（pytest 通过 PYTHONPATH=src 执行）。
# 3.13 与 3.14 行为差异未触发本包 API 兼容性问题；新代码避免使用 3.14 独有语法。
requires-python = ">=3.13,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "AI Test Component Team" }]
dependencies = [
  "portalocker>=3.2,<4",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
aitest = "aitest.interfaces.tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aitest"]

[tool.hatch.build]
include = [
  "src/aitest/**/*.py",
  "src/aitest/resources/templates/**/*.json",
  "src/aitest/contracts/schemas/*.json",
  "src/aitest/resources/panel/dist/*.js",
]
artifacts = ["src/aitest/resources/panel/dist/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# 让 `pytest tests` 无需手动 PYTHONPATH=src 即可解析 aitest 模块；
# 同时保留 "." 让 tests/ 内 conftest 与相对导入可用。
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".uv-cache", ".uv-python", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 工程基线 3.13；mypy 用 3.13 目标检查可同时覆盖 3.14 兼容场景。
python_version = "3.13"
strict = true
packages = ["aitest"]
mypy_path = "src"
