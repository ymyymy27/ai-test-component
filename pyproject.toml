[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-test-component"
version = "0.4.0"
description = "Phase-one local AI-assisted testing plugin skeleton"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "AI Test Component Team" }]
dependencies = [
  "portalocker>=3.2,<4",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
aitest = "aitest.interfaces.tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aitest"]

[tool.hatch.build]
include = [
  "src/aitest/**/*.py",
  "src/aitest/resources/templates/**/*.json",
  "src/aitest/contracts/schemas/*.json",
  "src/aitest/resources/panel/dist/*.js",
]
artifacts = ["src/aitest/resources/panel/dist/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".uv-cache", ".uv-python", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["aitest"]
mypy_path = "src"
