<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="AI 测试 · 本地测试工作台" />
    <title>AI 辅助测试</title>
    <script>
      // 首帧前确定主题：手动选择 > 宿主主动主题/VS Code 暗色类 > 系统 prefers-color-scheme。
      (function () {
        try {
          var stored = localStorage.getItem("aitest.theme");
          var choice = stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
          var effective = choice;
          if (choice === "auto") {
            var host = window.aitestHost;
            var hostTheme = host && typeof host.getTheme === "function" ? host.getTheme() : null;
            if (hostTheme === "dark" || hostTheme === "light") {
              effective = hostTheme;
            } else if (
              document.body &&
              (document.body.classList.contains("vscode-dark") ||
                document.body.classList.contains("vscode-high-contrast"))
            ) {
              effective = "dark";
            } else if (
              typeof window.matchMedia === "function" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
              effective = "dark";
            } else {
              effective = "light";
            }
          }
          document.documentElement.dataset.theme = effective;
          document.documentElement.dataset.themeChoice = choice;
        } catch (error) {
          // 存储不可用时保留 HTML 上的默认浅色。
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
